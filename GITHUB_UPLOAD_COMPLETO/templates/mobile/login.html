<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f172a">
<title>Login — Medições</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/mobile.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">📋</div>
  <div class="login-title">Medições</div>
  <div class="login-sub">Plataforma Ocupacional</div>

  <div class="login-card">
    {% if erro %}
    <div class="login-err">{{ erro }}</div>
    {% endif %}

    <form method="POST" action="/mobile/login">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="text" id="email" name="email" placeholder="usuario@ocupacional.com.br"
               value="{{ email or '' }}" autocomplete="username" autocapitalize="none">
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••"
               autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
  </div>
</div>
</body>
</html>
