<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Ocupacional SST</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #2DD4BF; --brand-d: #14B8A6;
      --bg: #07090E; --surface: #0E1118; --surface2: #141925;
      --border: #1C2236; --border2: #273050;
      --text: #E8EDF5; --text2: #7A8FA8; --red: #E05252;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 40px 44px; width: 100%; max-width: 420px; }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .logo-icon { width: 36px; height: 36px; background: var(--brand); border-radius: 9px;
                 display: flex; align-items: center; justify-content: center;
                 font-size: 16px; font-weight: 800; color: #07090E; }
    .logo-text { font-size: 16px; font-weight: 700; }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; }
    .erro { background: rgba(224,82,82,.1); border: 1px solid rgba(224,82,82,.3);
            border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--red); margin-bottom: 16px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--text2);
            text-transform: uppercase; letter-spacing: .5px; margin-bottom: 7px; }
    input { width: 100%; background: var(--surface2); border: 1px solid var(--border2);
            border-radius: 8px; padding: 12px 14px; color: var(--text); font-size: 14px;
            font-family: inherit; outline: none; transition: border .2s; }
    input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(45,212,191,.1); }
    .btn { width: 100%; background: var(--brand); color: #07090E; border: none;
           border-radius: 8px; padding: 13px; font-size: 15px; font-weight: 700;
           cursor: pointer; transition: background .2s; margin-top: 4px; }
    .btn:hover { background: var(--brand-d); }
    .footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text2); }
    .footer a { color: var(--brand); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">O</div>
      <div class="logo-text">Ocupacional SST</div>
    </div>
    <h2>Redefinir senha</h2>
    <p class="sub">Digite sua nova senha abaixo.</p>

    {% if erro %}<div class="erro">⚠ {{ erro }}</div>{% endif %}

    {% if expirado %}
      <div class="footer" style="margin-top:0"><a href="{{ url_for('auth.esqueci_senha') }}">Solicitar novo link</a></div>
    {% else %}
    <form method="POST">
      <div class="field">
        <label>Nova senha</label>
        <input type="password" name="nova_senha" placeholder="Mínimo 6 caracteres" required minlength="6" autofocus>
      </div>
      <div class="field">
        <label>Confirmar senha</label>
        <input type="password" name="confirma" placeholder="Repita a nova senha" required minlength="6">
      </div>
      <button type="submit" class="btn">Redefinir senha</button>
    </form>
    {% endif %}

    <div class="footer"><a href="{{ url_for('auth.login') }}">← Voltar ao login</a></div>
  </div>
</body>
</html>
